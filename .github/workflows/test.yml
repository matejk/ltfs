name: Test Suite

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.build }} (${{ matrix.fuse }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: [autotools, cmake]
        fuse: [fuse3, fuse2]

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get -q update
          sudo apt-get -q -y install --no-install-recommends \
            build-essential automake autoconf libtool pkg-config cmake \
            icu-devtools libicu-dev libxml2-dev uuid-dev libsnmp-dev \
            libfuse-dev fuse3 libfuse3-dev attr
          sudo install -m 755 tests/docker/icu-config /usr/local/bin/icu-config

      - name: Build (autotools)
        if: matrix.build == 'autotools'
        run: |
          ./autogen.sh
          ./configure --enable-icu-6x ${{ matrix.fuse == 'fuse2' && '--with-fuse2' || '' }}
          make -j"$(nproc)"

      - name: Run tests (autotools)
        if: matrix.build == 'autotools'
        run: make check VERBOSE=1 || { cat tests/test-suite.log; exit 1; }

      - name: Build (cmake)
        if: matrix.build == 'cmake'
        run: |
          cmake -S . -B build -DLTFS_WITH_FUSE2=${{ matrix.fuse == 'fuse2' && 'ON' || 'OFF' }}
          cmake --build build -j"$(nproc)"

      - name: Run tests (cmake)
        if: matrix.build == 'cmake'
        run: ctest --test-dir build --output-on-failure
